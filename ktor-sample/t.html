<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            color: white;
            padding: 20px;
        }

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(59,130,246,0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 10%;
            left: 5%;
            z-index: 0;
        }

        .icon-bar {
            width: 100%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .icon-bar a {
            display: inline-block;
            padding: 18px 24px;
            color: white;
            font-size: 28px;
            transition: 0.3s ease;
        }

        .icon-bar a:hover {
            background: rgba(255,255,255,0.12);
        }

        .game-panel {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 24px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            z-index: 2;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.8rem;
        }

        #status {
            text-align: center;
            margin: 12px 0 24px;
            color: #cbd5e1;
            font-weight: bold;
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .checkers-board {
            border-collapse: collapse;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            overflow: hidden;
            border-radius: 16px;
        }

        .square {
            width: 60px;
            height: 60px;
            text-align: center;
            vertical-align: middle;
        }

        .light { background-color: #f0d9b5; }
        .dark { background-color: #7c3aed; }

        .label {
            width: 30px;
            height: 30px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-weight: bold;
            text-align: center;
        }

        .piece {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            margin: auto;
            margin-top: 8px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4),
                        inset 0 -2px 4px rgba(0,0,0,0.3),
                        0 2px 4px rgba(0,0,0,0.3);
        }

        .white-piece { background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1); }
        .black-piece { background: radial-gradient(circle at 30% 30%, #64748b, #0f172a); }

        #moveForm {
            max-width: 500px;
            margin: 30px auto 0;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        #move {
            flex: 1;
            min-width: 220px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        #move::placeholder { color: rgba(255,255,255,0.45); }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 999px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 8px 25px rgba(59,130,246,0.35);
            transition: transform 0.25s ease;
        }

        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="glow"></div>

    <div class="icon-bar">
        <a class="active" href="/"><i class="fa fa-home"></i></a>
    </div>

    <div class="game-panel">
        <h1>♟ Checkers Game</h1>
        <p style="text-align:center;">Player ID: {{ playerId }}</p>
        <p id="status">Waiting for moves...</p>

        <div class="board-container">
            <table class="checkers-board">
                <tr>
                    <td></td>
                    {% for col in ['A','B','C','D','E','F','G','H'] %}
                        <td class="label">{{ col }}</td>
                    {% endfor %}
                </tr>
                {% for row in [1,2,3,4,5,6,7,8] %}
                <tr>
                    <td class="label">{{ row }}</td>
                    {% for col in [1,2,3,4,5,6,7,8] %}
                        <td class="square {% if (row + col) is even %}light{% else %}dark{% endif %}"></td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

    <form id="moveForm" action="/move" method="post">
        <input type="hidden" name="gameId" value="{{ gameId }}">
        <input type="hidden" name="playerId" value="{{ playerId }}">
        <label for="move">Enter move:</label>
        <input type="text" name="move" id="move" placeholder="A3-B4">
        <button type="submit">Submit Move</button>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const boardString = "{{ boardString }}";
            function parseBoardString(str) {
                const board = [];
                for (let i = 0; i < 8; i++) {
                    const row = [];
                    for (let j = 0; j < 8; j++) row.push(str[i * 8 + j]);
                    board.push(row);
                }
                return board;
            }
            function updateBoardHTML(board) {
                const table = document.querySelector(".checkers-board");
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        const cell = table.rows[i + 1].cells[j + 1];
                        const piece = board[i][j];
                        if (piece === "r" || piece === "w") {
                            cell.innerHTML = '<div class="piece white-piece"></div>';
                        } else if (piece === "b") {
                            cell.innerHTML = '<div class="piece black-piece"></div>';
                        } else {
                            cell.innerHTML = "";
                        }
                    }
                }
            }
            const board = parseBoardString(boardString);
            updateBoardHTML(board);
            const socket = new WebSocket("ws://localhost:8080/ws/{{ gameId }}");
            socket.onmessage = (event) => {
                const newBoard = parseBoardString(event.data);
                updateBoardHTML(newBoard);
                document.getElementById("status").textContent = "Board updated!";
            };
            const form = document.getElementById("moveForm");
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const response = await fetch("/move", { method: "POST", body: formData });
                if (!response.ok) alert("Move failed");
                else {
                    document.getElementById("status").textContent = "Move submitted!";
                    document.getElementById("move").value = "";
                }
            });
        });
    </script>
</body>
</html>
