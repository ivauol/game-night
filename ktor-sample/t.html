<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> game menu </title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            color: white;
            padding: 20px;
        }
        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(59,130,246,0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 10%;
            left: 5%;
            z-index: 0;
        }
        .icon-bar {
            width: 100%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        .icon-bar a {
            display: inline-block;
            padding: 18px 24px;
            color: white;
            font-size: 28px;
        }

        h1 { text-align: center; margin-bottom: 10px; font-size: 2.8rem; }


        .label {
            width: 30px;
            height: 30px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-weight: bold;
            text-align: center;
        }

        .flex-container {
            min-height: calc(100vh - 160px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            margin: 5px;

        } 

        .form-container a{
            font-size: 30px;
            
        }
        .text {
            text-align: center;
            color: rgba(255,255,255,0.75);
        }

        .text a {
            color: #93c5fd;
            text-decoration: none;
            font-weight: bold;
        }

        .form-container:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(83, 32, 201, 0.45);
        }

    </style>
</head>
<body>
    <div class="icon-bar">
        <a href="/gamecenter"><i class="fa fa-home"></i></a>

        <div style="float: right;">
            {% if login %}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {% else %}
                <a href="/stats">Profile</a>
                <form action="/logout" method="post" style="display:inline;">
                    <button class="play-btn" type="submit">Logout</button>
                </form>
            {% endif %}
        </div>
    </div>
    <div class="glow"></div>

    <body>
        <div class= "flex-container">
            <div class= "form-container">        
                <p class="text"><a href="/search?status=active">Active Games</a></p>         
            </div>
            <div class= "form-container">        
                <p class="text"><a href="/search?status=ended">Ended Games</a></p>       
            </div>
            <div class= "form-container">         
                <p class="text"> <a href="/wait">Make New Game</a></p>        
            </div>
        </div>
    </body>

</body>
</html>
